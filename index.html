<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Swigaato — Gonda Ka Apna Food Delivery</title>
  
  <meta name="description" content="Swigaato connects local kitchens, delivery riders, and customers exclusively in Gonda, Uttar Pradesh. Fast delivery, Hindi + English, UPI & COD.">
  <meta name="theme-color" content="#12663E">

  <!-- Google Fonts: Baloo 2 and DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%2312663E' stroke-width='5'><rect width='64' height='64' rx='16' fill='%23F2B230'/><path d='M8 30h48a24 24 0 0 1-48 0z'/><path d='M24 22c0-4 4-4 4-8M34 22c0-4 4-4 4-8'/></svg>">
</head>
<body>
  <!-- Root application anchor -->
  <div id="swigaato-app-root">
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center; color: #FFFBF2; font-family: 'DM Sans', sans-serif">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="width: 52px; height: 52px; border-radius: 16px; background: #F2B230; display: flex; align-items: center; justify-content: center">
          <svg width="32" height="32" viewBox="0 0 64 64" fill="none" stroke="#12663E" stroke-width="4">
            <path d="M8 30h48a24 24 0 0 1-48 0z"></path>
          </svg>
        </div>
        <div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px">Loading Swigaato Gonda...</div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
